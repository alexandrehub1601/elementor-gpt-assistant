name: Monitor de ingressos (Ticketmaster)

on:
  schedule:
    # A cada 10 minutos. O GitHub trata agendamentos como "melhor esforço" e
    # costuma atrasar em horários de pico — para vigilância minuto a minuto,
    # rode "npm run tickets:watch" num servidor próprio.
    # Atenção: agendamento só funciona com este arquivo na branch principal.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "O que fazer nesta execução"
        type: choice
        default: once
        options:
          - once   # verificar disponibilidade de verdade
          - test   # mandar e-mail de teste para todos os destinatários
          - find   # procurar o ID de um evento na Discovery API
      busca:
        description: "Só no modo find: nome do show a procurar"
        type: string
        default: "harry styles"
      pais:
        description: "Só no modo find: código do país (GB, IT, US...). Vazio = todos"
        type: string
        default: ""

concurrency:
  group: ticket-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependência de e-mail
        run: npm install nodemailer@^6.9.14 --no-save --no-audit --no-fund

      # Sem isso, cada execução começaria "sem memória" e reenviaria o mesmo alerta.
      - name: Restaurar estado anterior
        uses: actions/cache/restore@v4
        with:
          path: tickets/.state
          key: ticket-state-${{ github.run_id }}
          restore-keys: ticket-state-

      - name: Verificar disponibilidade
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          MAIL_TRANSPORT: ${{ vars.MAIL_TRANSPORT || 'smtp' }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TZ: America/Sao_Paulo
          # A Ticketmaster bloqueia (HTTP 403) conexões vindas de datacenter,
          # e o runner do GitHub é datacenter. Insistir na página pública daqui
          # só geraria requisição recusada a cada 10 min, então fica só a API
          # oficial. Rodando "watch" numa máquina própria, remova esta linha.
          TICKETS_PAGE_PROBE: "0"
          # Passados como env (e não interpolados no script) para que texto
          # livre digitado no formulário não vire comando de shell.
          MODO: ${{ inputs.modo || 'once' }}
          BUSCA: ${{ inputs.busca }}
          PAIS: ${{ inputs.pais }}
        run: |
          if [ "$MODO" = "find" ]; then
            node tickets/src/find.js "$BUSCA" "$PAIS"
          else
            node tickets/src/run.js "$MODO"
          fi

      - name: Guardar estado
        # O modo "test" não produz estado real de disponibilidade.
        if: always() && (inputs.modo || 'once') == 'once'
        uses: actions/cache/save@v4
        with:
          path: tickets/.state
          key: ticket-state-${{ github.run_id }}
