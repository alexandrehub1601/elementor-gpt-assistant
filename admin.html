<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de mensagens | Estúdio F/Ale</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#7A1531">
<link rel="icon" href="assets/logo/simbolo-fale.svg" type="image/svg+xml">
<style>
@font-face{font-family:"Passeio";src:url("assets/fonts/Passeio-Light.ttf") format("truetype");font-weight:300;font-style:normal;font-display:swap}
@font-face{font-family:"Passeio";src:url("assets/fonts/Passeio-Regular.ttf") format("truetype");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Passeio";src:url("assets/fonts/Passeio-ExtraBold.ttf") format("truetype");font-weight:800;font-style:normal;font-display:swap}
:root{
  /* cor — paleta oficial Estúdio F/Ale */
  --ink:#1D1D1D;          /* preto */
  --paper:#F5F4F1;        /* off-white */
  --paper-2:#ECE6DA;      /* creme */
  --wine:#7A1531;         /* vinho */
  --gold:#C59A45;         /* mostarda / dourado */
  --green:#0F3C37;        /* verde-escuro */
  --graphite:#55524C;     /* texto secundário no claro */
  --mist:#B9B3A8;         /* texto secundário no escuro */
  --accent:var(--wine);   /* ação no claro */
  --accent-soft:var(--gold); /* ação no escuro */
  --line:rgba(29,29,29,.16);
  --line-dark:rgba(245,244,241,.2);
  --error:#B3261E;

  /* tipo — escala 1.25 sobre 17px */
  --font:"Passeio",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --fs-sm:.875rem;
  --fs-base:1.0625rem;
  --fs-md:1.3125rem;
  --fs-lg:clamp(1.375rem,1.1rem + .9vw,1.875rem);
  --fs-xl:clamp(1.875rem,1.2rem + 2.2vw,3.25rem);
  --fs-display:clamp(2.25rem,1.2rem + 3.6vw,4.75rem);

  /* espaço — base 8 */
  --gutter:clamp(1.25rem,4vw,3.5rem);
  --section:clamp(5rem,10vw,10rem);
  --maxw:90rem;

  /* forma e movimento */
  --radius-s:4px;
  --radius-pill:999px;
  --ease:cubic-bezier(.2,.7,.2,1);
  --slash:16.5deg; /* inclinação da barra do F/ALE */
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100svh;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:var(--fs-base);line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul,dl,dd{margin:0;padding:0}
button,input{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--wine);outline-offset:3px;border-radius:2px}
[hidden]{display:none!important}
.visually-hidden{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:2.75rem;padding:.6rem 1.15rem;border-radius:var(--radius-pill);border:1.5px solid currentColor;background:transparent;font-size:var(--fs-sm);line-height:1;text-decoration:none;cursor:pointer;transition:background-color .2s var(--ease),color .2s var(--ease),border-color .2s var(--ease)}
.btn--solid{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn--solid:hover{background:var(--wine);border-color:var(--wine)}
.btn--ghost:hover{background:var(--ink);color:var(--paper)}
.btn--danger{color:var(--error)}
.btn--danger:hover{background:var(--error);border-color:var(--error);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* ---------- login ---------- */
.login{min-height:100svh;display:grid;place-items:center;padding:2rem var(--gutter);background:var(--wine);color:var(--paper)}
.login__card{width:min(100%,24rem);background:var(--paper);color:var(--ink);border-radius:6px;padding:clamp(1.75rem,4vw,2.5rem);display:grid;gap:1.5rem}
.login__brand{display:flex;align-items:center;gap:.875rem}
.login__brand svg{width:2.5rem;height:auto;color:var(--wine)}
.login__brand span{font-size:var(--fs-sm);color:var(--graphite)}
.login h1{font-weight:800;font-size:var(--fs-lg);line-height:1.1;letter-spacing:-.02em}
.field{display:grid;gap:.5rem}
.field label{font-size:var(--fs-sm)}
.pass{position:relative}
.input{width:100%;min-height:3rem;padding:.7rem 3.25rem .7rem .9rem;border:1.5px solid var(--line);border-radius:var(--radius-s);background:#fff}
.input:focus{outline:none;border-color:var(--wine)}
.pass__toggle{position:absolute;right:.25rem;top:50%;transform:translateY(-50%);min-width:2.75rem;min-height:2.5rem;border:0;background:none;cursor:pointer;font-size:.8125rem;color:var(--graphite)}
.err{font-size:var(--fs-sm);color:var(--error)}
.err:empty{display:none}

/* ---------- painel ---------- */
.bar{position:sticky;top:0;z-index:10;background:var(--wine);color:var(--paper)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:4rem}
.bar__brand{display:flex;align-items:center;gap:1rem}
.bar__brand svg{width:9rem;height:auto;color:var(--gold)}
.bar__brand span{font-size:var(--fs-sm);padding-left:1rem;border-left:1px solid var(--line-dark)}
.bar .btn{color:var(--paper)}
.bar .btn:hover{background:var(--paper);color:var(--ink)}
.wrap{width:100%;max-width:64rem;margin-inline:auto;padding-inline:var(--gutter)}
.head{padding-block:clamp(2rem,5vw,3rem) 1.5rem;display:grid;gap:1.25rem}
.head h1{font-weight:800;font-size:var(--fs-xl);line-height:1.05;letter-spacing:-.03em}
.summary{color:var(--graphite)}
.toolbar{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center}
.search{flex:1 1 16rem;min-height:2.75rem;padding:.6rem .9rem;border:1.5px solid var(--line);border-radius:var(--radius-pill);background:#fff}
.search:focus{outline:none;border-color:var(--wine)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:var(--radius-pill);overflow:hidden}
.seg button{min-height:2.5rem;padding:.4rem 1rem;border:0;background:none;cursor:pointer;font-size:var(--fs-sm)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.list{display:grid;gap:.75rem;padding-bottom:4rem}
.msg{background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.msg.is-new{border-left:4px solid var(--gold)}
.msg summary{display:grid;grid-template-columns:1fr auto;gap:.25rem 1rem;align-items:baseline;padding:1rem 1.25rem;cursor:pointer;list-style:none}
.msg summary::-webkit-details-marker{display:none}
.msg summary:hover{background:rgba(29,29,29,.03)}
.msg__name{font-weight:800;font-size:var(--fs-md);letter-spacing:-.01em;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.badge{font-weight:400;font-size:.75rem;line-height:1;padding:.35rem .6rem;border-radius:var(--radius-pill);background:var(--gold);color:var(--ink)}
.msg__date{font-size:var(--fs-sm);color:var(--graphite);white-space:nowrap}
.msg__biz{grid-column:1/-1;font-size:var(--fs-sm);color:var(--graphite)}
.msg__body{padding:0 1.25rem 1.25rem;display:grid;gap:1.25rem;border-top:1px solid var(--line);padding-top:1.25rem}
.msg__grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem 1.5rem}
.msg__grid dt{font-size:.8125rem;color:var(--graphite)}
.msg__grid dd{margin-top:.15rem;overflow-wrap:anywhere}
.msg__grid a{color:var(--wine)}
.msg__project{white-space:pre-wrap;background:var(--paper);border-radius:var(--radius-s);padding:1rem;max-width:72ch}
.msg__actions{display:flex;flex-wrap:wrap;gap:.6rem}
.empty,.notice{padding:2.5rem 1.5rem;text-align:center;color:var(--graphite);background:#fff;border:1px dashed var(--line);border-radius:6px}
.notice{color:var(--error);border-style:solid}
@media (max-width:640px){
  .bar__brand span{display:none}
  .msg__grid{grid-template-columns:1fr}
  .msg summary{grid-template-columns:1fr}
}
</style>
</head>

<!-- ============ LOGIN ============ -->
<main class="login" id="login-view" hidden>
  <form class="login__card" id="login-form" novalidate>
    <div class="login__brand">
      <svg viewBox="0 0 366.03 369.8" aria-hidden="true"><use href="#simbolo-fale"/></svg>
      <span>Estúdio F/Ale</span>
    </div>
    <h1>Painel de mensagens</h1>
    <div class="field">
      <label for="senha">Senha</label>
      <div class="pass">
        <input class="input" id="senha" name="senha" type="password" autocomplete="current-password" required aria-describedby="login-err">
        <button class="pass__toggle" type="button" id="toggle-pass" aria-controls="senha" aria-pressed="false">Mostrar</button>
      </div>
    </div>
    <p class="err" id="login-err" role="alert"></p>
    <button class="btn btn--solid" type="submit" id="login-btn">Entrar</button>
  </form>
</main>

<!-- ============ PAINEL ============ -->
<div id="panel-view" hidden>
  <header class="bar">
    <div class="wrap">
      <div class="bar__brand">
        <svg viewBox="0 0 511.75 78.96" role="img" aria-label="Estúdio F/Ale"><use href="#logo-fale"/></svg>
        <span>Painel</span>
      </div>
      <button class="btn" type="button" id="logout">Sair</button>
    </div>
  </header>
  <main class="wrap">
    <div class="head">
      <h1>Mensagens do site</h1>
      <p class="summary" id="summary" aria-live="polite">Carregando…</p>
      <div class="toolbar">
        <label class="visually-hidden" for="q">Buscar mensagens</label>
        <input class="search" id="q" type="search" placeholder="Buscar por nome, negócio ou texto">
        <div class="seg" role="group" aria-label="Filtrar">
          <button type="button" data-filter="todas" aria-pressed="true">Todas</button>
          <button type="button" data-filter="novas" aria-pressed="false">Novas</button>
        </div>
        <button class="btn btn--ghost" type="button" id="refresh">Atualizar</button>
        <button class="btn btn--ghost" type="button" id="export">Exportar planilha</button>
      </div>
    </div>
    <div class="list" id="list"></div>
  </main>
</div>

<script>
(function(){
  var API='/api', H={'X-Fale-Painel':'1'};
  var loginView=document.getElementById('login-view'), panelView=document.getElementById('panel-view');
  var listEl=document.getElementById('list'), summary=document.getElementById('summary'), q=document.getElementById('q');
  var all=[], filter='todas';

  function api(path,opts){
    opts=opts||{}; opts.credentials='same-origin';
    opts.headers=Object.assign({},H,opts.body?{'Content-Type':'application/json'}:{},opts.headers||{});
    return fetch(API+path,opts).then(function(r){
      return r.json().catch(function(){return {}}).then(function(j){
        if(r.status===401&&path!=='/login'){ showLogin('Sua sessão expirou. Entre de novo.'); throw new Error('sessao'); }
        if(!r.ok){ var e=new Error(j.erro||'Erro '+r.status); e.status=r.status; throw e }
        return j;
      });
    });
  }
  function showLogin(msg){ panelView.hidden=true; loginView.hidden=false; document.getElementById('login-err').textContent=msg||''; document.getElementById('senha').focus() }
  function showPanel(){ loginView.hidden=true; panelView.hidden=false; load() }

  /* ---------- login ---------- */
  document.getElementById('toggle-pass').addEventListener('click',function(){
    var i=document.getElementById('senha'), show=i.type==='password'; i.type=show?'text':'password';
    this.textContent=show?'Ocultar':'Mostrar'; this.setAttribute('aria-pressed',String(show));
  });
  document.getElementById('login-form').addEventListener('submit',function(e){
    e.preventDefault();
    var senha=document.getElementById('senha').value, err=document.getElementById('login-err'), btn=document.getElementById('login-btn');
    if(!senha){ err.textContent='Digite a senha.'; return }
    btn.disabled=true; btn.textContent='Entrando…'; err.textContent='';
    api('/login',{method:'POST',body:JSON.stringify({senha:senha})}).then(function(){ document.getElementById('senha').value=''; showPanel() })
      .catch(function(x){ err.textContent=x.message })
      .finally(function(){ btn.disabled=false; btn.textContent='Entrar' });
  });
  document.getElementById('logout').addEventListener('click',function(){
    api('/logout',{method:'POST'}).finally(function(){ all=[]; listEl.textContent=''; showLogin() });
  });

  /* ---------- mensagens ---------- */
  function load(){
    summary.textContent='Carregando…';
    api('/mensagens').then(function(j){ all=j.mensagens||[]; render() }).catch(function(x){
      if(x.message==='sessao') return;
      listEl.textContent=''; var n=document.createElement('p'); n.className='notice'; n.textContent=x.message; listEl.appendChild(n); summary.textContent='';
    });
  }
  function fmtDate(iso){ try{ return new Date(iso).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}) }catch(e){ return iso } }
  function contactHref(v){
    if(/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) return 'mailto:'+v;
    var d=v.replace(/\D/g,''); if(d.length>=10){ if(d.length<=11) d='55'+d; return 'https://wa.me/'+d }
    return null;
  }
  function linkHref(v){
    if(!v) return null; var s=v.trim();
    if(/^@[\w.]+$/.test(s)) s='https://instagram.com/'+s.slice(1);
    else if(!/^https?:\/\//i.test(s)) s='https://'+s;
    try{ var u=new URL(s); return /^https?:$/.test(u.protocol)?u.href:null }catch(e){ return null }
  }
  function el(tag,cls,text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e }
  function row(dl,label,value,href){
    dl.appendChild(el('dt',null,label)); var dd=el('dd');
    if(href){ var a=el('a',null,value); a.href=href; if(!href.startsWith('mailto:')){a.target='_blank';a.rel='noopener noreferrer'} dd.appendChild(a) } else dd.textContent=value||'—';
    dl.appendChild(dd);
  }
  function render(){
    var term=q.value.trim().toLowerCase();
    var items=all.filter(function(m){
      if(filter==='novas'&&m.lida) return false;
      if(!term) return true;
      return [m.nome,m.contato,m.negocio,m.momento,m.projeto,m.link].join(' ').toLowerCase().indexOf(term)>-1;
    });
    var novas=all.filter(function(m){return !m.lida}).length;
    summary.textContent=all.length?(all.length+(all.length===1?' mensagem':' mensagens')+', '+novas+(novas===1?' nova':' novas')+'.'):'';
    listEl.textContent='';
    if(!all.length){ listEl.appendChild(el('p','empty','Nenhuma mensagem ainda. Quando alguém enviar o formulário do site, ela aparece aqui.')); return }
    if(!items.length){ listEl.appendChild(el('p','empty','Nenhuma mensagem encontrada com esse filtro.')); return }
    items.forEach(function(m){
      var d=el('details','msg'+(m.lida?'':' is-new')); d.dataset.id=m.id;
      var s=el('summary'); var name=el('span','msg__name',m.nome); if(!m.lida) name.appendChild(el('span','badge','Nova'));
      s.appendChild(name); s.appendChild(el('span','msg__date',fmtDate(m.criadaEm))); s.appendChild(el('span','msg__biz',m.negocio));
      d.appendChild(s);
      var body=el('div','msg__body'); var dl=el('dl','msg__grid');
      row(dl,'Contato',m.contato,contactHref(m.contato)); row(dl,'Momento do negócio',m.momento);
      row(dl,'Negócio',m.negocio); row(dl,'Site ou Instagram',m.link,linkHref(m.link));
      body.appendChild(dl);
      var pj=el('div'); pj.appendChild(el('p',null,'Sobre o projeto')).style.cssText='font-size:.8125rem;color:var(--graphite);margin-bottom:.35rem'; pj.appendChild(el('p','msg__project',m.projeto)); body.appendChild(pj);
      var act=el('div','msg__actions');
      var toggle=el('button','btn btn--ghost',m.lida?'Marcar como nova':'Marcar como lida'); toggle.type='button';
      toggle.addEventListener('click',function(){ setRead(m,!m.lida) });
      var del=el('button','btn btn--danger','Excluir'); del.type='button';
      del.addEventListener('click',function(){ if(confirm('Excluir a mensagem de '+m.nome+'? Essa ação não pode ser desfeita.')) remove(m) });
      act.appendChild(toggle); act.appendChild(del); body.appendChild(act); d.appendChild(body);
      d.addEventListener('toggle',function(){ if(d.open&&!m.lida) setRead(m,true,true) });
      listEl.appendChild(d);
    });
  }
  function setRead(m,lida,keepOpen){
    api('/mensagens?id='+encodeURIComponent(m.id),{method:'PATCH',body:JSON.stringify({lida:lida})}).then(function(){
      m.lida=lida; var openId=keepOpen?m.id:null; render();
      if(openId){ var d=listEl.querySelector('[data-id="'+openId+'"]'); if(d) d.open=true }
    }).catch(function(x){ if(x.message!=='sessao') alert(x.message) });
  }
  function remove(m){
    api('/mensagens?id='+encodeURIComponent(m.id),{method:'DELETE'}).then(function(){ all=all.filter(function(x){return x.id!==m.id}); render() })
      .catch(function(x){ if(x.message!=='sessao') alert(x.message) });
  }
  q.addEventListener('input',render);
  [].forEach.call(document.querySelectorAll('[data-filter]'),function(b){
    b.addEventListener('click',function(){ filter=b.dataset.filter; [].forEach.call(document.querySelectorAll('[data-filter]'),function(o){o.setAttribute('aria-pressed',String(o===b))}); render() });
  });
  document.getElementById('refresh').addEventListener('click',load);
  document.getElementById('export').addEventListener('click',function(){
    if(!all.length){ alert('Ainda não há mensagens para exportar.'); return }
    var cols=[['criadaEm','Data'],['nome','Nome'],['contato','Contato'],['negocio','Negócio'],['momento','Momento'],['projeto','Projeto'],['link','Site ou Instagram'],['lida','Lida']];
    var esc=function(v){ v=v==null?'':String(v); if(/^[=+\-@]/.test(v)) v="'"+v; return '"'+v.replace(/"/g,'""')+'"' };
    var lines=[cols.map(function(c){return esc(c[1])}).join(';')].concat(all.map(function(m){ return cols.map(function(c){ var v=m[c[0]]; if(c[0]==='criadaEm') v=fmtDate(v); if(c[0]==='lida') v=v?'Sim':'Não'; return esc(v) }).join(';') }));
    var blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='mensagens-estudio-fale-'+new Date().toISOString().slice(0,10)+'.csv';
    document.body.appendChild(a); a.click(); setTimeout(function(){URL.revokeObjectURL(a.href); a.remove()},500);
  });

  /* início: já está logado? */
  fetch(API+'/login',{credentials:'same-origin'}).then(function(r){return r.json()}).then(function(j){ j.autenticado?showPanel():showLogin() })
    .catch(function(){ showLogin('Não foi possível falar com o servidor. O painel só funciona com o site publicado na Vercel.') });
})();
</script>
</body>
</html>
