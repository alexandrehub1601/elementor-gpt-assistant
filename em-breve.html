:root{--wine:#7A1531;--gold:#C59A45;--paper:#F5F4F1;--ease:cubic-bezier(.2,.7,.2,1)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;min-height:100svh;display:grid;place-items:center;background:var(--wine);color:var(--paper);font-family:"Lato",ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-align:center;padding:2rem 1rem}
main{width:100%;display:flex;flex-direction:column;align-items:center;gap:clamp(2rem,5vh,3rem)}
.symbol{width:clamp(7.5rem,22vw,12rem);height:auto;color:var(--gold)}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.words{position:relative;width:min(100%,34rem);height:1.4em;overflow:hidden;font-size:clamp(.8125rem,.7rem + .6vw,1.25rem);font-weight:400;text-transform:uppercase;letter-spacing:.22em}
/* rotação só com CSS: funciona mesmo se o WordPress remover scripts */
.words span{position:absolute;inset:0;display:block;line-height:1.4em;white-space:nowrap;opacity:0;padding-left:.22em;animation:word 9s var(--ease) infinite both}
.words span:nth-child(2){animation-delay:3s}
.words span:nth-child(3){animation-delay:6s}
@keyframes word{0%{opacity:0;transform:translateY(100%)}5%,30%{opacity:1;transform:none}35%,100%{opacity:0;transform:translateY(-100%)}}
.email{color:var(--gold);text-decoration:none;font-size:clamp(1rem,.9rem + .4vw,1.125rem);padding:.75rem .25rem;border-bottom:1px solid rgba(197,154,69,.5);transition:border-color .2s var(--ease),color .2s var(--ease)}
.email:hover{border-color:var(--gold);color:var(--paper)}
.email:focus-visible{outline:2px solid var(--gold);outline-offset:4px;border-radius:2px}
@media (prefers-reduced-motion:no-preference){
  .symbol{animation:in 1.2s var(--ease) both,breathe 6s var(--ease) 1.2s infinite}
  .words,.email{animation:fade 1s var(--ease) .5s both}
  .email{animation-delay:.8s}
}
@keyframes in{from{opacity:0;transform:scale(.92)}}
@keyframes breathe{50%{transform:scale(1.04)}}
@keyframes fade{from{opacity:0;transform:translateY(.5rem)}}
/* com redução de movimento: só troca suave, sem deslizar */
@media (prefers-reduced-motion:reduce){
  .words span{animation-name:word-fade}
}
@keyframes word-fade{0%{opacity:0}5%,30%{opacity:1}35%,100%{opacity:0}}
@media (max-width:480px){.words{letter-spacing:.12em}.words span{padding-left:.12em}}
</style>
