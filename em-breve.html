:root{--wine:#7A1531;--gold:#C59A45;--paper:#F5F4F1;--ease:cubic-bezier(.2,.7,.2,1)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;min-height:100svh;display:grid;place-items:center;background:var(--wine);color:var(--paper);font-family:"Passeio",ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-align:center;padding:2rem 1rem}
main{display:flex;flex-direction:column;align-items:center;gap:clamp(2rem,5vh,3rem)}
.symbol{width:clamp(7.5rem,22vw,12rem);height:auto;color:var(--gold)}

.words{position:relative;height:1.3em;overflow:hidden;font-size:clamp(1.25rem,1rem + 1.2vw,1.75rem);letter-spacing:.01em;min-width:12ch}
.words span{position:absolute;inset:0;display:block;line-height:1.3em;opacity:0;transform:translateY(100%);transition:transform .7s var(--ease),opacity .7s var(--ease)}
.words span.is-on{opacity:1;transform:none}
.words span.is-out{opacity:0;transform:translateY(-100%)}
.email{color:var(--gold);text-decoration:none;font-size:clamp(1rem,.9rem + .4vw,1.125rem);padding:.75rem .25rem;border-bottom:1px solid rgba(197,154,69,.5);transition:border-color .2s var(--ease),color .2s var(--ease)}
.email:hover{border-color:var(--gold);color:var(--paper)}
.email:focus-visible{outline:2px solid var(--gold);outline-offset:4px;border-radius:2px}
@media (prefers-reduced-motion:no-preference){
  .symbol{animation:in 1.2s var(--ease) both,breathe 6s var(--ease) 1.2s infinite}
  .words,.email{animation:fade 1s var(--ease) .5s both}
  .email{animation-delay:.8s}
}
@keyframes in{from{opacity:0;transform:scale(.92)}}
@keyframes breathe{50%{transform:scale(1.04)}}
@keyframes fade{from{opacity:0;transform:translateY(.5rem)}}
@media (prefers-reduced-motion:reduce){
  .words{height:auto;overflow:visible}
  .words span{position:static;display:inline;opacity:1;transform:none}
  .words span+span::before{content:" / ";color:var(--gold)}
}
