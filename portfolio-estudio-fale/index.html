<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estúdio Fale · Portfólio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Geist:wght@400;500&display=swap">
<style>
/* Layout: cabeçalho enxuto, grade em colunas (masonry) só com os criativos, visualização ampliada ao clicar */
:root {
  --bg: #f7f7f5;
  --fg: #141414;
  --muted: #74746f;
  --line: #e4e4df;
  --tile: #ecebe7;
  --tile-2: #e2e1dc;
  --overlay: rgba(14, 14, 14, 0.98);
  --on-overlay: #f7f7f5;
  --font-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Geist", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --radius: 6px;
  --gap: clamp(10px, 1.6vw, 20px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121211; --fg: #efefec; --muted: #8f8f8a; --line: #262624;
    --tile: #1c1c1a; --tile-2: #242422; --overlay: rgba(8, 8, 8, 0.96); --on-overlay: #efefec;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121211; --fg: #efefec; --muted: #8f8f8a; --line: #262624;
  --tile: #1c1c1a; --tile-2: #242422; --overlay: rgba(8, 8, 8, 0.96); --on-overlay: #efefec;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
img, video { max-width: 100%; display: block; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }

.wrap { max-width: 1320px; margin: 0 auto; padding-inline: clamp(16px, 4vw, 48px); }

/* Cabeçalho */
.top {
  display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;
  padding-block: calc(24px + env(safe-area-inset-top, 0px)) 0;
  font-size: 0.85rem; color: var(--muted);
}
.top a { color: var(--fg); text-decoration: none; border-bottom: 1px solid var(--line); padding-bottom: 2px; }
.top a:hover { border-color: var(--fg); }

.hero { padding-block: clamp(56px, 10vw, 128px) clamp(40px, 6vw, 72px); }
.wordmark {
  font-family: var(--font-display); font-weight: 700; font-optical-sizing: auto;
  font-size: clamp(3.2rem, 11vw, 9.5rem); line-height: 0.88; letter-spacing: -0.045em;
  margin: 0;
}
.wordmark .light { font-weight: 400; color: var(--muted); }
.lede {
  display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap;
  margin-top: clamp(24px, 3vw, 40px);
}
.lede p { margin: 0; max-width: 42ch; font-size: 1.05rem; }
.count { font-family: var(--font-display); font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }

/* Grade */
.grid { display: flex; gap: var(--gap); align-items: flex-start; padding-bottom: 96px; }
.col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--gap); }
.item {
  display: block; width: 100%; padding: 0; border: 0; background: none; cursor: zoom-in;
  border-radius: var(--radius); overflow: hidden; position: relative;
}
.frame { width: 100%; max-width: 100%; background: var(--tile); overflow: hidden; border-radius: var(--radius); }
.frame img, .frame video { width: 100%; height: 100%; object-fit: cover; transition: transform .6s cubic-bezier(.2,.7,.2,1); }
.item:hover .frame img, .item:hover .frame video { transform: scale(1.025); }

.ph {
  width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between;
  padding: 16px; color: var(--muted); font-size: 0.78rem; text-align: left;
  background:
    radial-gradient(120% 80% at 100% 0%, var(--tile-2) 0%, transparent 60%),
    var(--tile);
}
.ph .n { font-family: var(--font-display); font-size: 1.6rem; font-weight: 600; color: var(--fg); opacity: 0.18; letter-spacing: -0.03em; }
.ph .f { display: flex; justify-content: space-between; gap: 8px; letter-spacing: 0.06em; text-transform: uppercase; }

/* Rodapé */
footer {
  border-top: 1px solid var(--line);
  display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap;
  padding-block: 32px calc(40px + env(safe-area-inset-bottom, 0px));
  color: var(--muted); font-size: 0.85rem;
}
footer .cta { font-family: var(--font-display); font-size: clamp(1.4rem, 3vw, 2rem); font-weight: 600; letter-spacing: -0.02em; color: var(--fg); text-decoration: none; }
footer .cta:hover { text-decoration: underline; text-underline-offset: 6px; text-decoration-thickness: 1px; }

/* Visualização ampliada */
.viewer {
  position: fixed; inset: 0; z-index: 50; background: var(--overlay); color: var(--on-overlay);
  display: grid; grid-template-rows: auto 1fr auto;
  padding: calc(12px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
}
.viewer-bar { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.viewer-stage { display: grid; place-items: center; min-height: 0; padding-block: 12px; }
.viewer-stage img, .viewer-stage video, .viewer-stage .ph {
  max-height: calc(100vh - 140px); max-height: calc(100dvh - 140px); max-width: min(100%, 900px);
  width: auto; height: auto; border-radius: var(--radius); object-fit: contain;
}
.viewer-stage .ph { height: calc(100dvh - 160px); max-height: 760px; }
.viewer-nav { display: flex; justify-content: center; gap: 12px; }
.vbtn {
  font: inherit; font-size: 0.85rem; color: var(--on-overlay); background: transparent;
  border: 1px solid color-mix(in srgb, var(--on-overlay) 30%, transparent); border-radius: 999px;
  padding: 9px 18px; cursor: pointer;
}
.vbtn:hover { border-color: var(--on-overlay); }

@media (max-width: 640px) {
  .ph .n { font-size: 1.2rem; }
  .ph { padding: 12px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <span>Estúdio Fale</span>
    <a href="#contato">Fale com a gente</a>
  </header>

  <section class="hero">
    <h1 class="wordmark">Estúdio<br><span class="light">Fale</span></h1>
    <div class="lede">
      <p>Uma seleção dos criativos que produzimos para marcas que querem ser vistas e lembradas.</p>
      <span class="count" id="count"></span>
    </div>
  </section>

  <main class="grid" id="grid" aria-label="Criativos"></main>

  <footer id="contato">
    <a class="cta" href="#">Vamos criar o próximo?</a>
    <span>contato@estudiofale.com.br · @estudiofale</span>
  </footer>
</div>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Criativo ampliado" hidden>
  <div class="viewer-bar">
    <span id="v-pos"></span>
    <button class="vbtn" type="button" id="v-close">Fechar</button>
  </div>
  <div class="viewer-stage" id="v-stage"></div>
  <div class="viewer-nav">
    <button class="vbtn" type="button" id="v-prev">Anterior</button>
    <button class="vbtn" type="button" id="v-next">Próximo</button>
  </div>
</div>

<script>
/*
  Para trocar os placeholders, preencha "src" com o caminho do arquivo (ex.: "img/criativo-01.webp").
  Vídeos (.mp4/.webm) também funcionam. "formato" define a proporção do espaço: "4:5", "9:16", "1:1" ou "16:9".
  Itens com "src" vazio aparecem como placeholder.
*/
const CRIATIVOS = [
  { src: "", formato: "4:5" },
  { src: "", formato: "9:16" },
  { src: "", formato: "1:1" },
  { src: "", formato: "4:5" },
  { src: "", formato: "4:5" },
  { src: "", formato: "9:16" },
  { src: "", formato: "1:1" },
  { src: "", formato: "4:5" },
  { src: "", formato: "16:9" },
  { src: "", formato: "4:5" },
  { src: "", formato: "9:16" },
  { src: "", formato: "4:5" },
  { src: "", formato: "1:1" },
  { src: "", formato: "4:5" },
  { src: "", formato: "9:16" },
  { src: "", formato: "4:5" },
  { src: "", formato: "1:1" },
  { src: "", formato: "4:5" },
];

const pad = (n) => String(n).padStart(2, "0");
const ratio = (f) => f.replace(":", " / ");
const isVideo = (s) => /\.(mp4|webm|mov)(\?|$)/i.test(s);

function media(c, i, big) {
  if (!c.src) {
    return `<div class="ph" style="aspect-ratio:${ratio(c.formato)}">
      <span class="n">${pad(i + 1)}</span>
      <span class="f"><span>Criativo</span><span>${c.formato}</span></span>
    </div>`;
  }
  if (isVideo(c.src)) {
    return `<video src="${c.src}" ${big ? "controls autoplay" : "autoplay"} muted loop playsinline preload="metadata"></video>`;
  }
  return `<img src="${c.src}" alt="Criativo ${pad(i + 1)}" loading="${i < 6 ? "eager" : "lazy"}">`;
}

const grid = document.getElementById("grid");
const tile = (c, i) => `
  <button class="item" type="button" data-i="${i}" aria-label="Ampliar criativo ${pad(i + 1)}">
    <div class="frame" style="aspect-ratio:${ratio(c.formato)}">${media(c, i, false)}</div>
  </button>`;

// Distribui na ordem da lista, sempre na coluna mais curta, para a leitura seguir da esquerda para a direita
let cols = 0;
function layout() {
  const n = window.innerWidth < 640 ? 2 : 3;
  if (n === cols) return;
  cols = n;
  const heights = Array(n).fill(0), buckets = Array.from({ length: n }, () => []);
  CRIATIVOS.forEach((c, i) => {
    const [w, h] = c.formato.split(":").map(Number);
    const k = heights.indexOf(Math.min(...heights));
    buckets[k].push(tile(c, i)); heights[k] += h / w;
  });
  grid.innerHTML = buckets.map((b) => `<div class="col">${b.join("")}</div>`).join("");
}
layout();
window.addEventListener("resize", layout);
document.getElementById("count").textContent = `${pad(CRIATIVOS.length)} criativos`;

const viewer = document.getElementById("viewer");
const stage = document.getElementById("v-stage");
let current = 0, lastFocus = null;

function show(i) {
  current = (i + CRIATIVOS.length) % CRIATIVOS.length;
  const c = CRIATIVOS[current];
  stage.innerHTML = media(c, current, true);
  const ph = stage.querySelector(".ph"); if (ph) ph.style.aspectRatio = ratio(c.formato);
  document.getElementById("v-pos").textContent = `${pad(current + 1)} / ${pad(CRIATIVOS.length)}`;
}
function open(i) {
  lastFocus = document.activeElement;
  show(i); viewer.hidden = false; document.body.style.overflow = "hidden";
  document.getElementById("v-close").focus();
}
function close() {
  viewer.hidden = true; stage.innerHTML = ""; document.body.style.overflow = "";
  if (lastFocus) lastFocus.focus();
}

grid.addEventListener("click", (e) => {
  const item = e.target.closest(".item"); if (item) open(+item.dataset.i);
});
document.getElementById("v-close").addEventListener("click", close);
document.getElementById("v-prev").addEventListener("click", () => show(current - 1));
document.getElementById("v-next").addEventListener("click", () => show(current + 1));
viewer.addEventListener("click", (e) => { if (e.target === viewer || e.target === stage) close(); });
document.addEventListener("keydown", (e) => {
  if (viewer.hidden) return;
  if (e.key === "Escape") close();
  if (e.key === "ArrowRight") show(current + 1);
  if (e.key === "ArrowLeft") show(current - 1);
});

let touchX = null;
viewer.addEventListener("touchstart", (e) => { touchX = e.touches[0].clientX; }, { passive: true });
viewer.addEventListener("touchend", (e) => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX; touchX = null;
  if (Math.abs(dx) > 50) show(current + (dx < 0 ? 1 : -1));
});
</script>
</body>
</html>
