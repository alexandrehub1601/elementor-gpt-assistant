<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estúdio F/Ale · Portfólio</title>
<meta name="theme-color" content="#7A1531">
<style>
/* Layout: faixa vinho com o logo, título curto, grade em colunas só com os criativos, rodapé vinho com chamada */
@font-face { font-family: "Passeio"; src: url("assets/fonts/Passeio-Light.ttf") format("truetype"); font-weight: 300; font-display: swap; }
@font-face { font-family: "Passeio"; src: url("assets/fonts/Passeio-Regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Passeio"; src: url("assets/fonts/Passeio-ExtraBold.ttf") format("truetype"); font-weight: 800; font-display: swap; }

/* Paleta oficial Estúdio F/Ale (mesma do site) */
:root {
  --ink: #1D1D1D;
  --paper: #F5F4F1;
  --paper-2: #ECE6DA;
  --wine: #7A1531;
  --gold: #C59A45;
  --graphite: #55524C;
  --line: rgba(29, 29, 29, 0.14);
  --font: "Passeio", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 4px;
  --gap: clamp(10px, 1.6vw, 20px);
  --gutter: clamp(16px, 4vw, 56px);
  --ease: cubic-bezier(.2, .7, .2, 1);
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--font); font-weight: 400; font-size: 17px; line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
img, video, svg { max-width: 100%; display: block; }
[hidden] { display: none !important; }
::selection { background: var(--wine); color: var(--paper); }
:focus-visible { outline: 2px solid var(--wine); outline-offset: 3px; }

.wrap { max-width: 1440px; margin: 0 auto; padding-inline: var(--gutter); }

/* Faixa do topo */
.bar { background: var(--wine); color: var(--paper); }
.bar .wrap {
  display: flex; justify-content: space-between; align-items: center; gap: 16px;
  padding-block: calc(18px + env(safe-area-inset-top, 0px)) 18px;
}
.bar .logo { width: clamp(150px, 16vw, 190px); color: var(--gold); }
.bar a.link { color: var(--paper); text-decoration: none; font-size: 0.875rem; border-bottom: 1px solid rgba(245, 244, 241, 0.35); padding-bottom: 2px; }
.bar a.link:hover { border-color: var(--paper); }

/* Título */
.intro {
  display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap;
  padding-block: clamp(56px, 9vw, 120px) clamp(32px, 5vw, 56px);
}
.intro h1 {
  margin: 0; font-weight: 800; text-transform: uppercase; letter-spacing: -0.015em;
  font-size: clamp(2.4rem, 1.2rem + 5vw, 5.5rem); line-height: 0.92; text-wrap: balance;
}
.intro h1 .slash { color: var(--wine); font-weight: 300; }
.intro p { margin: 0; max-width: 36ch; color: var(--graphite); font-weight: 300; }

/* Grade */
.grid { display: flex; gap: var(--gap); align-items: flex-start; padding-bottom: clamp(72px, 9vw, 128px); }
.col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--gap); }
.item {
  display: block; width: 100%; padding: 0; border: 0; background: none; cursor: zoom-in;
  border-radius: var(--radius); overflow: hidden;
}
.frame { width: 100%; max-width: 100%; background: var(--paper-2); overflow: hidden; border-radius: var(--radius); }
.frame img, .frame video { width: 100%; height: 100%; object-fit: cover; transition: transform .7s var(--ease); }
.item:hover .frame img, .item:hover .frame video { transform: scale(1.025); }

.ph {
  width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between;
  padding: 16px; color: var(--graphite); font-size: 0.75rem; text-align: left; background: var(--paper-2);
}
.ph .n { font-size: 1.6rem; font-weight: 800; color: var(--ink); opacity: 0.14; }
.ph .f { display: flex; justify-content: space-between; gap: 8px; letter-spacing: 0.12em; text-transform: uppercase; }

/* Rodapé */
footer { background: var(--wine); color: var(--paper); }
footer .wrap {
  display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap;
  padding-block: clamp(48px, 7vw, 96px) calc(40px + env(safe-area-inset-bottom, 0px));
}
footer .cta {
  font-weight: 800; text-transform: uppercase; color: var(--gold); text-decoration: none;
  font-size: clamp(1.8rem, 1rem + 3vw, 3.25rem); line-height: 0.95; letter-spacing: -0.01em;
}
footer .cta:hover { color: var(--paper); }
footer .contact { font-size: 0.875rem; font-weight: 300; color: rgba(245, 244, 241, 0.8); text-align: right; }

/* Visualização ampliada */
.viewer {
  position: fixed; inset: 0; z-index: 50; background: var(--ink); color: var(--paper);
  display: grid; grid-template-rows: auto 1fr auto;
  padding: calc(12px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
}
.viewer-bar { display: flex; justify-content: space-between; align-items: center; font-size: 0.875rem; font-variant-numeric: tabular-nums; }
.viewer-stage { display: grid; place-items: center; min-height: 0; padding-block: 12px; }
.viewer-stage img, .viewer-stage video, .viewer-stage .ph {
  max-height: calc(100vh - 140px); max-height: calc(100dvh - 140px); max-width: min(100%, 900px);
  width: auto; height: auto; border-radius: var(--radius); object-fit: contain;
}
.viewer-stage .ph { height: calc(100dvh - 160px); max-height: 760px; }
.viewer-nav { display: flex; justify-content: center; gap: 12px; }
.vbtn {
  font: inherit; font-size: 0.875rem; color: var(--paper); background: transparent;
  border: 1px solid rgba(245, 244, 241, 0.35); border-radius: 999px; padding: 9px 20px; cursor: pointer;
  transition: background-color .2s var(--ease), color .2s var(--ease), border-color .2s var(--ease);
}
.vbtn:hover { background: var(--gold); border-color: var(--gold); color: var(--ink); }

@media (max-width: 640px) {
  .ph { padding: 12px; }
  .ph .n { font-size: 1.2rem; }
  footer .contact { text-align: left; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

.29-1.36-2.27-2.4-2.96-1.04-.68-2.24-1.03-3.6-1.03h-4.01v17.04h4.01Z"/><path d="M116.66,31.48h3.68v21.32h-3.68v-21.32Z"/><path d="M132.76,51.67c-1.59-.91-2.86-2.2-3.82-3.86-.96-1.66-1.43-3.55-1.43-5.69s.48-4,1.43-5.66c.95-1.66,2.23-2.94,3.82-3.86,1.59-.91,3.31-1.37,5.16-1.37s3.57.46,5.17,1.37c1.6.92,2.88,2.2,3.83,3.86.95,1.66,1.43,3.55,1.43,5.69s-.48,4-1.43,5.65c-.96,1.66-2.23,2.95-3.83,3.86-1.6.92-3.31,1.37-5.14,1.37s-3.6-.46-5.19-1.37ZM132.31,46.9c.58,1.36,1.37,2.4,2.35,3.12s2.08,1.09,3.29,1.09,2.3-.35,3.29-1.06c.98-.7,1.76-1.73,2.34-3.08.57-1.35.86-2.96.86-4.83s-.29-3.42-.88-4.78c-.58-1.36-1.37-2.4-2.37-3.12-1-.72-2.09-1.09-3.27-1.09s-2.3.35-3.29,1.06-1.76,1.73-2.34,3.09-.86,2.96-.86,4.81.29,3.42.88,4.78Z"/></svg>
    <a class="link" href="#contato">Fale com a gente</a>

</header>

<div class="wrap">
  <section class="intro">
    <h1>Portfólio<br>de criativos<span class="slash"> /</span></h1>
    <p>Peças que criamos para marcas dizerem a que vieram.</p>
  </section>

  <main class="grid" id="grid" aria-label="Criativos"></main>
</div>

<footer id="contato">
  <div class="wrap">
    <a class="cta" href="#">Vamos criar<br>o próximo?</a>
    <span class="contact">contato@estudiofale.com.br<br>@estudiofale</span>
  </div>
</footer>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Criativo ampliado" hidden>
  <div class="viewer-bar">
    <span id="v-pos"></span>
    <button class="vbtn" type="button" id="v-close">Fechar</button>
  </div>
  <div class="viewer-stage" id="v-stage"></div>
  <div class="viewer-nav">
    <button class="vbtn" type="button" id="v-prev">Anterior</button>
    <button class="vbtn" type="button" id="v-next">Próximo</button>
  </div>
</div>

<script>
/*
  Para adicionar criativos, inclua um item com "src" (ex.: "img/criativo-06.webp") e "formato".
  Formatos: "4:5", "3:4", "9:16", "1:1" ou "16:9". Vídeos (.mp4/.webm) também funcionam.
  Itens com "src" vazio aparecem como placeholder. Apague os placeholders que não forem usados.
*/
const CRIATIVOS = [
  { src: "img/criativo-01.webp", formato: "3:4" },
  { src: "img/criativo-02.webp", formato: "4:5" },
  { src: "img/criativo-03.webp", formato: "4:5" },
  { src: "img/criativo-04.webp", formato: "4:5" },
  { src: "img/criativo-05.webp", formato: "4:5" },
  { src: "", formato: "4:5" }, // Leve 3 e pague 2
  { src: "", formato: "4:5" }, // MBL Vitalício
  { src: "", formato: "4:5" }, // Beauty Business FAAP
  { src: "", formato: "4:5" }, // Imersão Doutores de Negócio
  { src: "", formato: "4:5" }, // Quiches no Delivery
  { src: "", formato: "4:5" }, // LIA
];

const pad = (n) => String(n).padStart(2, "0");
const ratio = (f) => f.replace(":", " / ");
const isVideo = (s) => /\.(mp4|webm|mov)(\?|$)/i.test(s);

function media(c, i, big) {
  if (!c.src) {
    return `<div class="ph" style="aspect-ratio:${ratio(c.formato)}">
      <span class="n">${pad(i + 1)}</span>
      <span class="f"><span>Criativo</span><span>${c.formato}</span></span>
    </div>`;
  }
  if (isVideo(c.src)) {
    return `<video src="${c.src}" ${big ? "controls autoplay" : "autoplay"} muted loop playsinline preload="metadata"></video>`;
  }
  return `<img src="${c.src}" alt="Criativo ${pad(i + 1)}" loading="${i < 6 ? "eager" : "lazy"}">`;
}

const grid = document.getElementById("grid");
const tile = (c, i) => `
  <button class="item" type="button" data-i="${i}" aria-label="Ampliar criativo ${pad(i + 1)}">
    <div class="frame" style="aspect-ratio:${ratio(c.formato)}">${media(c, i, false)}</div>
  </button>`;

// Distribui na ordem da lista, sempre na coluna mais curta, para a leitura seguir da esquerda para a direita
let cols = 0;
function layout() {
  const n = window.innerWidth < 640 ? 2 : 3;
  if (n === cols) return;
  cols = n;
  const heights = Array(n).fill(0), buckets = Array.from({ length: n }, () => []);
  CRIATIVOS.forEach((c, i) => {
    const [w, h] = c.formato.split(":").map(Number);
    const k = heights.indexOf(Math.min(...heights));
    buckets[k].push(tile(c, i)); heights[k] += h / w;
  });
  grid.innerHTML = buckets.map((b) => `<div class="col">${b.join("")}</div>`).join("");
}
layout();
window.addEventListener("resize", layout);

const viewer = document.getElementById("viewer");
const stage = document.getElementById("v-stage");
let current = 0, lastFocus = null;

function show(i) {
  current = (i + CRIATIVOS.length) % CRIATIVOS.length;
  const c = CRIATIVOS[current];
  stage.innerHTML = media(c, current, true);
  document.getElementById("v-pos").textContent = `${pad(current + 1)} / ${pad(CRIATIVOS.length)}`;
}
function open(i) {
  lastFocus = document.activeElement;
  show(i); viewer.hidden = false; document.body.style.overflow = "hidden";
  document.getElementById("v-close").focus();
}
function close() {
  viewer.hidden = true; stage.innerHTML = ""; document.body.style.overflow = "";
  if (lastFocus) lastFocus.focus();
}

grid.addEventListener("click", (e) => {
  const item = e.target.closest(".item"); if (item) open(+item.dataset.i);
});
document.getElementById("v-close").addEventListener("click", close);
document.getElementById("v-prev").addEventListener("click", () => show(current - 1));
document.getElementById("v-next").addEventListener("click", () => show(current + 1));
viewer.addEventListener("click", (e) => { if (e.target === viewer || e.target === stage) close(); });
document.addEventListener("keydown", (e) => {
  if (viewer.hidden) return;
  if (e.key === "Escape") close();
  if (e.key === "ArrowRight") show(current + 1);
  if (e.key === "ArrowLeft") show(current - 1);
});

let touchX = null;
viewer.addEventListener("touchstart", (e) => { touchX = e.touches[0].clientX; }, { passive: true });
viewer.addEventListener("touchend", (e) => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX; touchX = null;
  if (Math.abs(dx) > 50) show(current + (dx < 0 ? 1 : -1));
});
</script>
