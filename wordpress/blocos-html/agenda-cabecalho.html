<!-- Agenda Conexão Pop: CABEÇALHO. Cole num widget HTML do Elementor ACIMA do shortcode [agenda_conexao]. -->
<link rel="stylesheet" href="https://use.typekit.net/xqr3xib.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Pixel&family=TikTok+Sans:wght@400;500;600;700&display=swap">
<style>
.cpx-head{background:#111;color:#fff;font-family:"TikTok Sans",system-ui,sans-serif}
.cpx-head .cpx-wrap{max-width:1180px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.cpx-head .cpx-logo img{height:40px;width:auto;display:block}
.cpx-head nav{display:flex;align-items:center;gap:4px;margin-left:auto;flex-wrap:wrap}
.cpx-head nav a,.cpx-head nav button{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:8px 12px;border-radius:999px;border:0;background:transparent;color:#F4F1EC;font:600 15px/1.2 "TikTok Sans",system-ui,sans-serif;text-decoration:none;text-transform:none;letter-spacing:0;cursor:pointer;white-space:nowrap;box-shadow:none}
.cpx-head nav a:hover,.cpx-head nav button:hover{color:#fff;background:rgba(255,255,255,.08)}
.cpx-head nav a.cpx-cta{background:#D7FF47;color:#111}
.cpx-head nav a.cpx-cta:hover{background:#F4F1EC;color:#111}
.cpx-head svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:640px){.cpx-head nav{margin-left:0;width:100%}.cpx-head nav .cpx-portal{display:none}}
</style>
<header class="cpx-head"><div class="cpx-wrap">
  <a class="cpx-logo" href="https://conexaopop.com.br/"><img src="https://conexaopop.com.br/wp-content/plugins/agenda-conexao-pop/assets/img/logo-caixas.svg" alt="Conexão Pop" width="420" height="137"></a>
  <nav aria-label="Agenda">
    <!-- Troque o endereço abaixo pelo da sua página "Cadastrar meu show" -->
    <a class="cpx-cta" href="https://conexaopop.com.br/cadastrar-meu-show/">Cadastrar meu show</a>
    <button type="button" onclick="var b=document.getElementById('cpa-following');if(b)b.click();"><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>Meus alertas</button>
    <a class="cpx-portal" href="https://conexaopop.com.br/">Voltar para o portal</a>
  </nav>
</div></header>
