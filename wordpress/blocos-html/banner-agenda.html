<!-- Banner da Agenda Conexão Pop (identidade 2026). Cole num widget HTML do Elementor. Responsivo. -->
<link rel="stylesheet" href="https://use.typekit.net/xqr3xib.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Pixel&family=TikTok+Sans:wght@400;500;700&display=swap">
<style>
.cpb{--k:#111;--p:#FF1574;--l:#D7FF47;--b:#5145FF;--c:#F4F1EC;position:relative;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:center;gap:28px;overflow:hidden;border-radius:18px;background:var(--k);color:var(--c);isolation:isolate;padding:30px 40px 56px;min-height:260px;font-family:"TikTok Sans",system-ui,-apple-system,"Segoe UI",sans-serif;text-decoration:none;box-sizing:border-box}
.cpb *{box-sizing:border-box}
.cpb-photo{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover;object-position:50% 58%;filter:grayscale(1) contrast(1.15) brightness(.5);z-index:-2}
.cpb::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(17,17,17,.94) 0%,rgba(17,17,17,.6) 60%,rgba(17,17,17,.3) 100%);z-index:-1}
.cpb-sky{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:46px;fill:var(--p);z-index:0;display:block}
.cpb-text{position:relative;z-index:1;display:grid;gap:12px;justify-items:start}
.cpb .cpb-tag{margin:0;display:inline-block;background:var(--l);color:var(--k);font:400 13px/1 "Geist Pixel","Courier New",monospace;text-transform:uppercase;padding:5px 8px 4px}
.cpb .cpb-title{margin:0;font-family:"kensington","Kensington",Impact,"Arial Narrow",sans-serif;font-weight:700;font-size:clamp(40px,5.4vw,78px);line-height:.88;text-transform:uppercase;color:var(--c);letter-spacing:-.005em}
.cpb .cpb-title em{font-style:normal;color:var(--p)}
.cpb .cpb-sub{margin:0;max-width:44ch;font-size:clamp(15px,1.3vw,17px);line-height:1.45;color:#E9E4DC}
.cpb .cpb-btn{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:10px 22px;border-radius:999px;background:var(--l);color:var(--k);font:700 16px/1.2 "TikTok Sans",system-ui,sans-serif;text-transform:none;letter-spacing:0;border:0;box-shadow:none;transition:background .15s}
.cpb:hover .cpb-btn,.cpb:focus-visible .cpb-btn{background:var(--c)}
.cpb-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.cpb:hover .cpb-btn svg{transform:translateX(3px)}
.cpb:focus-visible{outline:3px solid var(--b);outline-offset:3px}
.cpb-tickets{position:relative;z-index:1;display:grid;gap:10px;justify-self:end;width:100%;max-width:370px}
.cpb-t{display:grid;grid-template-columns:62px minmax(0,1fr);background:var(--c);color:var(--k);border-radius:12px;overflow:hidden;box-shadow:0 14px 28px -16px rgba(0,0,0,.8)}
.cpb-t:nth-child(1){transform:rotate(-2deg) translateX(-14px)}
.cpb-t:nth-child(2){transform:rotate(1.5deg) translateX(10px)}
.cpb-t:nth-child(3){transform:rotate(-1deg)}
.cpb-d{background:var(--p);color:#fff;display:grid;justify-items:center;align-content:center;padding:6px 2px;border-right:3px dashed var(--c);line-height:1}
.cpb-t:nth-child(2) .cpb-d{background:var(--b)}
.cpb-d b{font-family:"kensington","Kensington",Impact,sans-serif;font-weight:700;font-size:34px;line-height:.95}
.cpb-d small{font:400 11px/1 "Geist Pixel","Courier New",monospace;text-transform:uppercase;margin-top:2px}
.cpb-i{padding:9px 12px;min-width:0}
.cpb-i strong{display:block;font-family:"kensington","Kensington",Impact,sans-serif;font-weight:700;font-size:24px;line-height:1;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cpb-i span{display:block;font-size:12.5px;color:#5E5A55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:760px){
  .cpb{grid-template-columns:1fr;padding:24px 20px 52px;min-height:0;gap:20px}
  .cpb-tickets{justify-self:stretch;max-width:none;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .cpb-t{grid-template-columns:1fr}
  .cpb-t:nth-child(n){transform:none}
  .cpb-d{grid-auto-flow:column;gap:5px;align-items:baseline;border-right:0;border-bottom:3px dashed var(--c);padding:6px 4px}
  .cpb-d b{font-size:24px}
  .cpb-i{padding:7px 8px}
  .cpb-i strong{font-size:17px}
  .cpb-i span{display:none}
  .cpb .cpb-btn{width:100%;justify-content:center}
  .cpb-sky{height:30px}
}
@media (prefers-reduced-motion:reduce){.cpb *{transition:none!important}}
</style>
