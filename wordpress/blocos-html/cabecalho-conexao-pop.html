<!-- Cabeçalho Conexão Pop · identidade 2026. Cole num widget HTML do Elementor no topo (de preferência no cabeçalho do Theme Builder). Responsivo. -->
<link rel="stylesheet" href="https://use.typekit.net/xqr3xib.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Pixel&family=TikTok+Sans:wght@400;500;700&display=swap">
<style>
.cph-h{--k:#111;--p:#FF1574;--l:#D7FF47;--b:#5145FF;--c:#F4F1EC;position:sticky;top:0;z-index:999;font-family:"TikTok Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--c)}
.admin-bar .cph-h{top:32px}
.cph-h *{box-sizing:border-box}
.cph-h a{color:inherit;text-decoration:none}
.cph-h ul{list-style:none;margin:0;padding:0}
.cph-h :focus-visible{outline:3px solid var(--l);outline-offset:3px}
.cph-h svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.cph-h-in{max-width:1320px;margin:0 auto;padding:0 20px}

/* Barra de cima (preta) */
.cph-h-util{background:var(--k);font-size:13px;overflow:hidden;max-height:38px;transition:max-height .25s}
.cph-h-util .cph-h-in{display:flex;align-items:center;gap:18px;min-height:38px}
.cph-h-data{font:400 12px/1 "Geist Pixel","Courier New",monospace;text-transform:uppercase;letter-spacing:.03em;color:var(--l)}
.cph-h-claim{color:#BDB7AE}
.cph-h-soc{display:flex;gap:4px;margin-left:auto}
.cph-h-soc a{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;color:var(--c);transition:background .15s,color .15s}
.cph-h-soc a:hover{background:var(--p);color:#fff}
.cph-h-soc svg{width:17px;height:17px}

/* Barra principal (rosa) */
.cph-h-main{background:var(--p)}
.cph-h-main .cph-h-in{display:flex;align-items:center;gap:22px;min-height:96px;transition:min-height .25s}
.cph-h-logo{flex:none;display:block;line-height:0}
.cph-h-logo img{height:62px;width:auto;display:block;transition:height .25s}
.cph-h-nav{flex:1;min-width:0}
.cph-h-nav ul{display:flex;justify-content:center;flex-wrap:wrap;gap:2px}
.cph-h-nav a{position:relative;display:inline-block;padding:8px 10px 6px;font:700 25px/1 "kensington","Kensington",Impact,"Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.01em;color:var(--c);isolation:isolate;white-space:nowrap}
/* A caixa inclinada do logo aparece atrás da editoria */
.cph-h-nav a::before{content:"";position:absolute;inset:2px -2px 0;background:var(--c);transform:skewY(-4deg) scaleX(0);transform-origin:left;transition:transform .22s cubic-bezier(.2,.7,.2,1);z-index:-1}
.cph-h-nav li:nth-child(even) a::before{transform:skewY(3deg) scaleX(0)}
.cph-h-nav a:hover,.cph-h-nav a:focus-visible,.cph-h-nav a[aria-current="page"]{color:var(--p)}
.cph-h-nav a:hover::before,.cph-h-nav a:focus-visible::before,.cph-h-nav a[aria-current="page"]::before{transform:skewY(-4deg) scaleX(1)}
.cph-h-nav li:nth-child(even) a:hover::before,.cph-h-nav li:nth-child(even) a:focus-visible::before,.cph-h-nav li:nth-child(even) a[aria-current="page"]::before{transform:skewY(3deg) scaleX(1)}
.cph-h-acts{flex:none;display:flex;align-items:center;gap:10px}
.cph-h-agenda{display:inline-flex;align-items:center;gap:8px;background:var(--l);color:var(--k)!important;border-radius:999px;padding:11px 18px;font-weight:700;font-size:15px;white-space:nowrap;transition:background .15s,transform .15s}
.cph-h-agenda:hover{background:var(--c);transform:rotate(-2deg)}
.cph-h-btn{width:46px;height:46px;border-radius:50%;border:2px solid var(--c);background:transparent;color:var(--c);display:grid;place-items:center;cursor:pointer;padding:0;transition:background .15s,color .15s}
.cph-h-btn:hover{background:var(--c);color:var(--p)}
.cph-h-menu{display:none}

/* Borda de pixels */
.cph-h .cph-h-edge{display:block;width:100%;height:clamp(18px,2.4vw,30px);stroke:none;fill:var(--p);transform:scale(-1,-1);margin-top:-1px;pointer-events:none}

/* Ao rolar a página */
.cph-h.is-min .cph-h-util{max-height:0}
.cph-h.is-min .cph-h-main .cph-h-in{min-height:66px}
.cph-h.is-min .cph-h-logo img{height:40px}

/* Busca */
.cph-h-busca{position:absolute;left:0;right:0;top:100%;background:var(--k);padding:22px 0 26px;border-bottom:4px solid var(--l)}
.cph-h-busca[hidden]{display:none}
.cph-h-busca form{display:flex;gap:10px;max-width:900px;margin:0 auto;padding:0 20px}
.cph-h-busca input{flex:1;min-width:0;min-height:56px;border:0;border-radius:999px;padding:0 24px;font:700 22px/1 "kensington","Kensington",Impact,sans-serif;text-transform:uppercase;letter-spacing:.02em;background:var(--c);color:var(--k)}
.cph-h-busca button{min-height:56px;border:0;border-radius:999px;padding:0 24px;background:var(--p);color:#fff;font-weight:700;font-size:16px;cursor:pointer}

/* Menu do celular */
.cph-h-drawer{position:fixed;inset:0;z-index:1000;background:var(--p);display:flex;flex-direction:column;overflow-y:auto}
.cph-h-drawer[hidden]{display:none}
.cph-h-drawer-top{display:flex;align-items:center;justify-content:space-between;padding:16px 20px}
.cph-h-drawer-top img{height:46px;width:auto}
.cph-h-drawer ul{padding:10px 20px 0;display:grid;gap:2px}
.cph-h-drawer ul a{display:inline-block;font:700 clamp(46px,13vw,72px)/.95 "kensington","Kensington",Impact,sans-serif;text-transform:uppercase;color:var(--c);padding:4px 0}
.cph-h-drawer ul li:nth-child(odd) a:hover,.cph-h-drawer ul a[aria-current="page"]{color:var(--l)}
.cph-h-drawer ul li:nth-child(even) a:hover{color:var(--k)}
.cph-h-drawer .cph-h-agenda{margin:24px 20px 0;align-self:flex-start;font-size:17px;padding:14px 22px}
.cph-h-drawer .cph-h-soc{margin:22px 20px 0;gap:8px}
.cph-h-drawer .cph-h-soc a{width:44px;height:44px;border:2px solid var(--c)}
.cph-h .cph-h-drawer-sky{margin-top:auto;width:100%;height:70px;fill:var(--k);stroke:none;display:block;flex:none}

@media (max-width:1240px){.cph-h-nav a{font-size:21px;padding:8px 7px 6px}.cph-h-claim{display:none}}
@media (max-width:1060px){
  .cph-h-nav,.cph-h-util,.cph-h-main .cph-h-agenda{display:none}
  .cph-h-menu{display:grid}
  .cph-h-main .cph-h-in{min-height:72px;justify-content:space-between}
  .cph-h-logo img{height:46px}
  .cph-h.is-min .cph-h-main .cph-h-in{min-height:60px}
  .cph-h.is-min .cph-h-logo img{height:36px}
}
@media (max-width:782px){.admin-bar .cph-h{top:0}}
@media (prefers-reduced-motion:reduce){.cph-h *{transition:none!important}}
</style>

<script>
(function(){
  var h=document.getElementById("cph-h");if(!h)return;
  var dias=["dom","seg","ter","qua","qui","sex","sáb"],meses=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"],n=new Date();
  var d=document.getElementById("cph-h-data");if(d)d.textContent=dias[n.getDay()]+" "+n.getDate()+" "+meses[n.getMonth()]+" "+n.getFullYear();
  var aqui=location.pathname.replace(/\/+$/,"/");
  h.querySelectorAll("nav a").forEach(function(a){try{if(new URL(a.href).pathname===aqui&&aqui!=="/")a.setAttribute("aria-current","page")}catch(e){}});
  var min=false;function rolar(){var y=window.scrollY,m=min?y>40:y>120;if(m!==min){min=m;h.classList.toggle("is-min",m)}}
  window.addEventListener("scroll",rolar,{passive:true});rolar();
  var sb=document.getElementById("cph-h-sbtn"),bx=document.getElementById("cph-h-busca");
  sb.addEventListener("click",function(){var abrir=bx.hidden;bx.hidden=!abrir;sb.setAttribute("aria-expanded",abrir);if(abrir)document.getElementById("cph-h-q").focus()});
  var mb=document.getElementById("cph-h-mbtn"),dr=document.getElementById("cph-h-drawer"),mc=document.getElementById("cph-h-mclose");
  function menu(abrir){dr.hidden=!abrir;mb.setAttribute("aria-expanded",abrir);document.documentElement.style.overflow=abrir?"hidden":"";(abrir?mc:mb).focus()}
  mb.addEventListener("click",function(){menu(true)});mc.addEventListener("click",function(){menu(false)});
  document.addEventListener("keydown",function(e){if(e.key!=="Escape")return;if(!dr.hidden)menu(false);else if(!bx.hidden){bx.hidden=true;sb.setAttribute("aria-expanded","false");sb.focus()}});
})();
</script>
